[package]
name = "distributionx-program"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[features]
spel-idl = []

[dependencies]
bincode = "1.3"
borsh.workspace = true
distributionx-circuit = { path = "../distributionx-circuit" }
distributionx-tree = { path = "../distributionx-tree" }
distributionx-wallet-ref = { path = "../distributionx-wallet-ref", default-features = false }
spel-framework.workspace = true
nssa_core.workspace = true
risc0-binfmt = "3.0.4"
risc0-zkvm.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[build-dependencies]
spel-framework.workspace = true
serde_json.workspace = true

[[bin]]
name = "distributionx"
path = "src/program.rs"
required-features = ["spel-idl"]

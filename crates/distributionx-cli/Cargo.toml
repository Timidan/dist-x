[package]
name = "distributionx-cli"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
bincode = "1.3"
bs58 = "0.5"
clap = { workspace = true, features = ["derive"] }
example_program_deployment_methods = { path = "../../methods" }

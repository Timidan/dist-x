distributionx-client = { path = "../distributionx-client" }
distributionx-circuit = { path = "../distributionx-circuit" }
distributionx-program = { path = "../distributionx-program" }
distributionx-tree = { path = "../distributionx-tree" }
distributionx-wallet-ref = { path = "../distributionx-wallet-ref" }

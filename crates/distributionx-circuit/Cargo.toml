[package]
name = "distributionx-circuit"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
ed25519-consensus = { version = "2.1.0", default-features = false }
ed25519-dalek.workspace = true
distributionx-tree = { path = "../distributionx-tree", default-features = false }
distributionx-wallet-ref = { path = "../distributionx-wallet-ref", default-features = false }
serde.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
criterion = "0.5"
distributionx-wallet-ref = { path = "../distributionx-wallet-ref" }

[[bench]]
name = "strict_ed25519_cost"
harness = false

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sequencer_service_rpc = { path = "../../.scaffold/cache/repos/lez/v0.2.4/lez/sequencer/service/rpc", features = ["client"] }
sha2 = "0.10.9"
tokio = { version = "1.50.0", features = ["rt-multi-thread", "time"] }
token_core = { path = "../../.scaffold/cache/repos/lez/v0.2.4/lez/programs/token/core" }
wallet = { path = "../../.scaffold/cache/repos/lez/v0.2.4/lez/wallet" }

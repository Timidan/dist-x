[package]
name = "distributionx-lez-adapter"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
common = { path = "../../.scaffold/cache/repos/lez/v0.2.4/lez/common" }
hex = "0.4.3"
url = "2.5.8"
lee = { path = "../../.scaffold/cache/repos/lez/v0.2.4/lee/state_machine" }

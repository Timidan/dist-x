[package]
name = "example_program_deployment_programs"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[package.metadata.risc0]
# RISC0 guest ELFs retain dependency source paths. Normalize the local and
# GitHub-hosted build homes so the same source produces the same image ID.
rustc-flags = [
    "--remap-path-prefix=/home/timidan=/workspace",
    "--remap-path-prefix=/home/runner=/workspace",
    "--remap-path-prefix=/root=/toolchain",
]

[dependencies]
bincode = "1.3"
distributionx-circuit = { path = "../../crates/distributionx-circuit" }
distributionx-wallet-ref = { path = "../../crates/distributionx-wallet-ref", default-features = false }
borsh.workspace = true
spel-framework.workspace = true
lee_core.workspace = true
risc0-binfmt = "3.0.4"
risc0-zkvm.workspace = true
serde.workspace = true

[[bin]]
name = "distributionx-methods-guest"
path = "src/main.rs"

[[bin]]
name = "distributionx"
path = "src/bin/distributionx.rs"

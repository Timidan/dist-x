[workspace]
resolver = "3"
# vendor/spel-framework is a vendored upstream fork with its own [workspace]. Keep
# it OUT of this workspace so its crates are external path-deps (cap-lints=allow):
# `cargo clippy --workspace -- -D warnings` then lints only first-party code and
# does not fail on the fork's upstream lints. (rustfmt still descends into path-dep
# sources, so the fmt step formats an explicit first-party package list instead of
# `--all`; see .github/workflows/distributionx-ci.yml and scripts/ci-local.sh.)
exclude = [".scaffold/cache/repos/lez/rc5", "vendor/spel-framework"]
members = [
  "methods",
  "methods/guest",
  "crates/lez-client-gen",
  "crates/distributionx-wallet-ref",
  "crates/distributionx-tree",
  "crates/distributionx-circuit",
  "crates/distributionx-program",
  "crates/distributionx-client",
  "crates/distributionx-bindings",
  "crates/distributionx-cli",
  "crates/distributionx-relayer-ref",
]

[workspace.package]
license = "MIT or Apache-2.0"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.dependencies]
risc0-zkvm = { version = "3.0.5", default-features = false, features = ["std"] }
risc0-build = "3.0.5"

spel-framework = { path = "vendor/spel-framework/spel-framework" }
spel-framework-core = { path = "vendor/spel-framework/spel-framework-core" }
spel-client-gen = { path = "vendor/spel-framework/spel-client-gen" }
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "27360cb7d6ccb2bfbcca7d171bab8a3938490264" }
lee = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "27360cb7d6ccb2bfbcca7d171bab8a3938490264" }

hex = "0.4.3"
bytemuck = "1.24.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
clap = { version = "4.5.42", features = ["derive", "env"] }
tokio = { version = "1.28.2", features = ["macros", "net", "rt-multi-thread", "sync", "fs"] }
borsh = { version = "1.5", features = ["derive"] }
anyhow = "1"
bip39 = "2"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hkdf = "0.12"
keyring = "2"
libsodium-sys-stable = "1"
rand_core = "0.6"
secrecy = "0.8"
thiserror = "1"
zeroize = { version = "1", features = ["zeroize_derive"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
